name: Update User Story Completion

on:
  issues:
    types: [edited, closed, reopened]
  project_card:
    types: [moved, created, edited]
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-completion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install @octokit/graphql

      - name: Calculate and Update Completion
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_NUMBER: 2  # Your user-level project number
        run: node .github/scripts/calculate-completion.js
