name: User Story Completion Calculator

# Trigger when issues or project items are updated
on:
  issues:
    types: [edited, labeled, unlabeled, closed, reopened]
  project_card:
    types: [moved, created, edited]
  # Manual trigger for testing
  workflow_dispatch:

jobs:
  update-completion:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      repository-projects: write
      
    steps:
      - name: Calculate User Story Completion
        uses: actions/github-script@v7
        env:
          PROJECT_NUMBER: 2
          OWNER_TYPE: 'user' # or 'organization'
          OWNER_NAME: 'Melendja'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const projectNumber = parseInt(process.env.PROJECT_NUMBER);
            const ownerType = process.env.OWNER_TYPE;
            const ownerName = process.env.OWNER_NAME;
            
            console.log('🚀 Starting User Story Completion Calculation...\n');

            // Query to get all project items with their fields
            const getProjectQuery = `
              query($owner: String!, $number: Int!) {
                ${ownerType}(login: $owner) {
                  projectV2(number: $number) {
                    id
                    title
                    fields(first: 20) {
                      nodes {
                        ... on ProjectV2Field {
                          id
                          name
                          dataType
                        }
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          dataType
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                    items(first: 100) {
                      pageInfo {
                        hasNextPage
                        endCursor
                      }
                      nodes {
                        id
                        content {
                          ... on Issue {
                            id
                            number
                            title
                            state
                            body
                            labels(first: 10) {
                              nodes {
                                name
                              }
                            }
                            repository {
                              nameWithOwner
                            }
                          }
                        }
                        fieldValues(first: 20) {
                          nodes {
                            ... on ProjectV2ItemFieldNumberValue {
                              field {
                                ... on ProjectV2Field {
                                  id
                                  name
                                }
                              }
                              number
                            }
                            ... on ProjectV2ItemFieldTextValue {
                              field {
                                ... on ProjectV2Field {
                                  id
                                  name
                                }
                              }
                              text
                            }
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              field {
                                ... on ProjectV2SingleSelectField {
                                  id
                                  name
                                }
                              }
                              name
                              optionId
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            try {
              // Fetch project data
              const result = await github.graphql(getProjectQuery, {
                owner: ownerName,
                number: projectNumber
              });

              const project = result[ownerType].projectV2;
              console.log(`📋 Project: ${project.title}\n`);

              // Find required fields
              const effortField = project.fields.nodes.find(f => 
                f.name.toLowerCase() === 'effort'
              );
              const statusField = project.fields.nodes.find(f => 
                f.name.toLowerCase() === 'status'
              );
              const completionField = project.fields.nodes.find(f => 
                f.name === 'User Story Completion'
              );

              if (!effortField) {
                console.error('❌ Error: "Effort" field not found in project');
                return;
              }
              if (!statusField) {
                console.error('❌ Error: "Status" field not found in project');
                return;
              }
              if (!completionField) {
                console.error('❌ Error: "User Story Completion" field not found in project');
                console.log('💡 Please add a text field named "User Story Completion" to your project');
                return;
              }

              const completedStatuses = ['completed', 'done', 'closed'];
              
              // Organize items by type
              const userStories = [];
              const tasks = [];
              
              for (const item of project.items.nodes) {
                if (!item.content) continue;
                
                const labels = item.content.labels?.nodes.map(l => l.name.toLowerCase()) || [];
                const issueNumber = item.content.number;
                
                // Get field values
                let effort = 0;
                let status = '';
                
                for (const fv of item.fieldValues.nodes) {
                  if (fv.field?.id === effortField.id) {
                    effort = fv.number || 0;
                  }
                  if (fv.field?.id === statusField.id) {
                    status = (fv.name || '').toLowerCase();
                  }
                }
                
                const itemData = {
                  projectItemId: item.id,
                  issueId: item.content.id,
                  number: issueNumber,
                  title: item.content.title,
                  body: item.content.body || '',
                  labels,
                  effort,
                  status,
                  isCompleted: completedStatuses.includes(status)
                };
                
                if (labels.includes('user story')) {
                  userStories.push(itemData);
                } else if (labels.includes('task') || labels.includes('bug')) {
                  tasks.push(itemData);
                }
              }

              console.log(`📊 Found ${userStories.length} User Stories and ${tasks.length} Tasks/Bugs\n`);

              // Process each User Story
              for (const story of userStories) {
                console.log(`\n🎯 User Story #${story.number}: ${story.title}`);
                console.log(`   Labels: ${story.labels.join(', ')}`);
                
                // Find child tasks/bugs that reference this User Story
                // Look for #<number> references in task bodies
                const childTasks = tasks.filter(task => {
                  // Check if task body mentions this story number
                  const mentionsStory = task.body.includes(`#${story.number}`);
                  // Also check for common parent reference patterns
                  const hasParentReference = 
                    task.body.toLowerCase().includes(`parent: #${story.number}`) ||
                    task.body.toLowerCase().includes(`user story: #${story.number}`) ||
                    task.body.toLowerCase().includes(`relates to #${story.number}`);
                  
                  return mentionsStory || hasParentReference;
                });

                console.log(`   📝 Found ${childTasks.length} child tasks/bugs`);
                
                if (childTasks.length === 0) {
                  console.log(`   ⚠️  No child tasks found. Make sure tasks reference #${story.number} in their description.`);
                  continue;
                }

                // Calculate completion
                let totalEffort = 0;
                let completedEffort = 0;
                
                for (const task of childTasks) {
                  totalEffort += task.effort;
                  if (task.isCompleted) {
                    completedEffort += task.effort;
                  }
                  
                  const statusIcon = task.isCompleted ? '✅' : '⏳';
                  console.log(`      ${statusIcon} #${task.number}: Effort=${task.effort}, Status=${task.status}`);
                }

                const completionPercentage = totalEffort > 0 
                  ? Math.round((completedEffort / totalEffort) * 100)
                  : 0;

                console.log(`\n   📈 Total Effort: ${totalEffort}`);
                console.log(`   ✨ Completed Effort: ${completedEffort}`);
                console.log(`   🎯 Completion: ${completionPercentage}%`);

                // Update the User Story Completion field
                const updateMutation = `
                  mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: ProjectV2FieldValue!) {
                    updateProjectV2ItemFieldValue(
                      input: {
                        projectId: $projectId
                        itemId: $itemId
                        fieldId: $fieldId
                        value: $value
                      }
                    ) {
                      projectV2Item {
                        id
                      }
                    }
                  }
                `;

                try {
                  await github.graphql(updateMutation, {
                    projectId: project.id,
                    itemId: story.projectItemId,
                    fieldId: completionField.id,
                    value: {
                      text: `${completionPercentage}%`
                    }
                  });
                  
                  console.log(`   ✅ Updated completion field to ${completionPercentage}%`);
                } catch (updateError) {
                  console.error(`   ❌ Failed to update: ${updateError.message}`);
                }
              }

              console.log('\n\n✨ Calculation complete!');
              
            } catch (error) {
              console.error('\n❌ Error occurred:', error.message);
              if (error.errors) {
                console.error('GraphQL Errors:', JSON.stringify(error.errors, null, 2));
              }
              core.setFailed(error.message);
            }
